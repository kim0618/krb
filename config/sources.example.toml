# KR-B 데이터 소스 설정 예제
#
# 이 파일은 예제다. 실제 값은 넣지 않는다.
# 실제 설정은 config/sources.toml(gitignore)로 복사해 쓰고,
# 인증정보는 파일이 아니라 환경변수로 주입한다. 아래 *_env는 환경변수 "이름"이다.
#
# US-B의 키·토큰·.env를 복사해 오지 않는다. 같은 계정을 쓰더라도 사용자가 직접 주입한다.
# 상세는 docs/SOURCE_REGISTER.md.

[project]
timezone = "Asia/Seoul"
calendar = "XKRX"
data_root = "data"            # raw/, cache/, processed/ 하위. 운영 서버가 아니라 로컬.

[sources.krx_openapi]
enabled = false
base_url = "https://openapi.krx.co.kr"
auth_key_env = "KRB_KRX_OPENAPI_KEY"
daily_call_limit = 10000      # V1 문서 확인값(키당 하루 1만 회). 실호출 미검증.

[sources.kiwoom]
enabled = false
app_key_env = "KRB_KIWOOM_APP_KEY"
app_secret_env = "KRB_KIWOOM_APP_SECRET"
# 주문 기능은 Phase 7(LIVE AUTO) 별도 승인 전까지 사용하지 않는다.

[sources.kis]
enabled = false
app_key_env = "KRB_KIS_APP_KEY"
app_secret_env = "KRB_KIS_APP_SECRET"
account_no_env = "KRB_KIS_ACCOUNT_NO"
environment = "paper"         # "paper"(모의, VTTC 계열) | "real". 실계좌 조회도 승인 후.

[sources.datagokr_pps]        # 조달청 나라장터 (data.go.kr)
enabled = false
service_key_env = "KRB_DATAGOKR_SERVICE_KEY"

[sources.opendart]
enabled = false
api_key_env = "KRB_OPENDART_API_KEY"

[sources.kind]
enabled = false               # 이용조건 UNKNOWN. 약관 확인 전 자동 조회 금지.

[sources.krx_data_system]
enabled = false               # 약관 10조2항 자동 수집 금지. 프로그램 접근 금지.
